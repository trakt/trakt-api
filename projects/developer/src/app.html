<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0d" />

    <title>Trakt Developer | API guides, reference, and playground</title>
    <meta
      name="description"
      content="Official developer portal for the Trakt API. Read the guides, browse every endpoint, and run authenticated requests straight from your browser."
    />
    <link rel="canonical" href="https://developer.trakt.tv/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trakt Developer" />
    <meta property="og:url" content="https://developer.trakt.tv/" />
    <meta property="og:title" content="Trakt Developer" />
    <meta
      property="og:description"
      content="Guides, a searchable endpoint reference, and a playground that runs authenticated requests in your browser."
    />
    <meta property="og:image" content="https://developer.trakt.tv/og/movies-trending.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Trakt Developer portal, showing a Trakt API endpoint and the HTTP methods the reference covers."
    />

    <!-- Twitter falls back to the og: equivalents for title, description and
         image, so only the card type needs stating. -->
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
