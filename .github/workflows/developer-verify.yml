name: Developer Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_TRAKT_CLIENT_ID: synthetic-ci-client-id-never-real
      PUBLIC_GITHUB_CLIENT_ID: synthetic-ci-client-id-never-real
    defaults:
      run:
        working-directory: projects/developer
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run format:svelte:check
      - run: bun run check
      - run: bun run test
      - run: bun run build
