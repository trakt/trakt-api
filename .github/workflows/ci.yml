name: The Trial of Truth aka CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  files-changed:
    if: github.event.pull_request.draft == false
    name: The Watchful Eye (Files Changed)
    runs-on: ubuntu-latest
    outputs:
      developer: ${{ steps.changes.outputs.developer }}
    steps:
      - name: The Oracle's Gaze aka Checkout Code
        uses: actions/checkout@v5

      - name: The Seer's Vision aka Filter Paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            developer:
              - 'projects/developer/**'
              - 'projects/api/**'
              - 'projects/openapi/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/developer.yml'
              - '.github/workflows/developer-verify.yml'
              - 'package.json'
              - 'bun.lock'
              - 'biome.json'
              - 'tsconfig.json'

  commitlint:
    needs: files-changed
    if: github.event_name == 'pull_request'
    name: The Gatekeeper's Grimoire (Commitlint)
    runs-on: ubuntu-latest
    steps:
      - name: Unveiling the Code Codex
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scrutinizing the Commit Chronicle
        uses: wagoid/commitlint-github-action@v3

      - name: Exterminating the Fixup Fiends
        uses: vladjerca/no-fixups-action@main
        with:
          skip-checkout: true

  api:
    needs: files-changed
    name: The Forge's Proving (API, Format, Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Summoning the Ancient Scrolls aka Checkout Code
        uses: actions/checkout@v5

      - name: The Oracle's Gaze aka Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: The Sacred Assembly aka Install Dependencies
        run: bun install --frozen-lockfile

      - name: The Mirror's Judgement aka Check Formatting
        run: bun run format:check

      - name: The Truth of Types aka Type Check Source
        working-directory: projects/api
        run: bun run check

      - name: The Rehearsed Offering aka Build Types and Publish Dry Run
        working-directory: projects/api
        run: bun run publish:check

      - name: The Purifying Flame aka Lint
        run: bun run lint

      - name: The Trial by Combat aka Test
        working-directory: projects/api
        run: bun run test

  openapi:
    needs: files-changed
    name: The Scribe's Chamber (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Summoning the Ancient Scrolls aka Checkout Code
        uses: actions/checkout@v5

      - name: The Oracle's Gaze aka Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: The Sacred Assembly aka Install Dependencies
        run: bun install --frozen-lockfile

      - name: The Scroll's Scrutiny aka Validate OpenAPI
        run: bun run openapi:validate

      - name: The Sacred Transcription aka Generate OpenAPI
        if: github.ref == 'refs/heads/master'
        run: bun run openapi:generate

      - name: Preserving the Sacred Texts aka Upload Definition
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: projects/openapi/openapi.json
          if-no-files-found: error
          retention-days: 30

      - name: The Sacred Transcription aka Upload to Readme
        if: github.ref == 'refs/heads/master'
        uses: readmeio/rdme@v10
        with:
          rdme: openapi upload ./projects/openapi/openapi.json --key=${{ secrets.README_API_KEY }} --slug=openapi.json

      - name: Summoning the GitHub App Token
        if: github.ref == 'refs/heads/master'
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: trakt-android

      - name: The Sacred Scroll's Journey aka Push OpenAPI to Android Repo
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ANDROID_DIR: ${{ runner.temp }}/trakt-android
        run: |
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/trakt/trakt-android.git" "$ANDROID_DIR"
          cp projects/openapi/openapi.json "$ANDROID_DIR/openapi/openapi.json"
          cd "$ANDROID_DIR"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b feat/openapi_ci
          git add openapi/openapi.json
          git commit -m 'chore: openapi schema updates'
          git push --force origin feat/openapi_ci

  developer:
    needs: files-changed
    if: needs.files-changed.outputs.developer == 'true' && github.event_name == 'pull_request'
    name: The Portal's Trial (Developer)
    uses: ./.github/workflows/developer-verify.yml

  ci-passed:
    if: always()
    needs: [files-changed, commitlint, api, openapi, developer]
    name: CI passed
    runs-on: ubuntu-latest
    steps:
      - name: The Final Verdict
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
